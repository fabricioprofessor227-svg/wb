<head>
<meta charset="UTF-8">

<title>📚 Tutorial · Como Montar um Leitor HTML com Voz</title>
<style>

    padding-bottom: 6px;
  }

    color: #0f3d2e;

    margin-bottom: 4px;
  }
  .progress-row {
    display: flex;
    align-items: center;

  }
  .text-content {
    text-align: justify;

    margin: 0 2px;

  .text-content h4 { font-size: 1.02em; }

    font-weight: 600;
  }

    border-bottom: 1px solid #dde5e0;
  }
  .tool-btn {
    background: #ecf3ef;
    border: 1px solid #b3cdbf;
    color: #134531;
    font-weight: 600;
    font-size: 1rem;
    padding: 8px 12px;
    border-radius: 48px;
    min-width: 50px;
    text-align: center;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;

  .tool-btn:disabled { opacity: 0.4; background: #e0e8e3; border-color: #b6ccc1; pointer-events: none; }

    border-color: #0f3d2e;

    color: #00695c;

  .tool-btn.ler-selecao.reading {
    background: #ffeb3b;
    border-color: #fbc02d;
    color: #5d4037;
  }
  .tool-btn.ler-selecao.paused {
    background: #ffe0b2;
    border-color: #ffb74d;
    color: #e65100;
  }
  .capa {
    text-align: center;

  .capa h1 { font-size: 24px; margin-bottom: 16px; color: #0f3d2e; }
  .capa h2 { font-size: 17px; margin-bottom: 30px; color: #1a5e44; }
  .capa p { font-size: 19px; color: #2a5e4a; }

    .fixed-header h1 { font-size: 1.2rem; }
    .text-content table { font-size: 0.75em; }
    .text-content pre { font-size: 0.7em; padding: 8px 10px; }
    .capa h1 { font-size: 20px; }
    .capa h2 { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="reader-wrapper">
  <div class="fixed-header">

</div>

<script>

  paginas.push(`

  paginas.push(`
    <h3>1. Visão Geral do Projeto</h3>
    <p>O arquivo que você analisou é um <strong>leitor de páginas HTML</strong> — uma aplicação web de arquivo único que permite navegar por várias páginas de conteúdo, ouvir o texto em voz alta, ler apenas um trecho selecionado, ajustar o tamanho da fonte e entrar em tela cheia.</p>

  `);

  paginas.push(`
    <h3>2. As Três Linguagens do Front-end</h3>
    <p>Todo site ou aplicação web no navegador é construído com três linguagens que trabalham juntas. Elas têm papéis bem definidos.</p>

    <h4>2.1 HTML — a estrutura</h4>
    <ul>
      <li><strong>HyperText Markup Language</strong>.</li>
      <li>Não é linguagem de programação: é linguagem de <em>marcação</em>.</li>
      <li>Define o que existe na página: títulos, parágrafos, listas, botões, imagens.</li>
      <li>Usa <strong>tags</strong> como <code>&lt;h1&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;button&gt;</code>.</li>
      <li>É a "planta baixa" da casa.</li>
    </ul>

    <h4>2.2 CSS — o visual</h4>
    <ul>
      <li><strong>Cascading Style Sheets</strong>.</li>
      <li>Define cores, fontes, espaçamentos, tamanhos, layout.</li>
      <li>Fica dentro de <code>&lt;style&gt;</code> (neste caso) ou em arquivo separado.</li>
      <li>Usa <strong>seletores</strong> (<code>body</code>, <code>.tool-btn</code>, <code>#pageContent</code>) e <strong>propriedades</strong>.</li>

    <ul>
      <li><code>&lt;head&gt;</code> → metadados, título, <code>&lt;style&gt;</code>.</li>
      <li><code>&lt;body&gt;</code> → HTML visível (header, conteúdo, botões).</li>
      <li><code>&lt;script&gt;</code> no fim do body → JavaScript.</li>

  `);

  paginas.push(`
    <h3>3. Estrutura do Arquivo HTML</h3>
    <p>Um arquivo HTML bem organizado tem uma anatomia previsível. Veja as partes principais do nosso leitor.</p>

    <h4>3.1 Esqueleto básico</h4>
    <pre>&lt;!DOCTYPE html&gt;
&lt;html lang="pt-BR"&gt;
&lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;meta name="viewport" content="..."&gt;
    &lt;title&gt;...&lt;/title&gt;
    &lt;style&gt; ... CSS ... &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    ... HTML visível ...
    &lt;script&gt; ... JavaScript ... &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>

    <h4>3.2 O papel de cada tag</h4>
    <ul>
      <li><code>&lt;!DOCTYPE html&gt;</code> → avisa que é HTML5.</li>
      <li><code>&lt;html lang="pt-BR"&gt;</code> → idioma (importante para leitores de tela e voz).</li>
      <li><code>&lt;meta charset="UTF-8"&gt;</code> → acentos e emojis corretos.</li>
      <li><code>&lt;meta name="viewport"&gt;</code> → responsividade em celular.</li>
      <li><code>&lt;title&gt;</code> → texto da aba do navegador.</li>
      <li><code>&lt;style&gt;</code> → CSS embutido.</li>
      <li><code>&lt;script&gt;</code> → JavaScript embutido.</li>
    </ul>

    <h4>3.3 Estrutura do body no nosso projeto</h4>
    <pre>&lt;div class="reader-wrapper"&gt;
  &lt;div id="readerScreen" class="screen active"&gt;
    &lt;div class="fixed-header"&gt; ... título, progresso ... &lt;/div&gt;
    &lt;div class="text-content" id="pageContent"&gt;&lt;/div&gt;
    &lt;div class="toolbar-single"&gt; ... botões ... &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;</pre>

    <h4>3.4 Por que separar em blocos</h4>
    <ul>
      <li>Cada <code>&lt;div&gt;</code> tem uma responsabilidade clara.</li>
      <li>Facilita o CSS (cada bloco tem sua classe).</li>
      <li>Facilita o JavaScript (busca por <code>id</code>).</li>
      <li>Melhora a manutenção e a leitura do código.</li>

    <h4>3.5 Ids e classes</h4>
    <ul>
      <li><strong>id</strong> → único na página (ex.: <code>pageContent</code>).</li>
      <li><strong>class</strong> → pode repetir (ex.: <code>tool-btn</code>).</li>
      <li>JavaScript usa id para pegar um elemento específico.</li>
      <li>CSS usa classe para estilizar vários ao mesmo tempo.</li>
    </ul>
  `);

    <p>O CSS define como a aplicação se parece. Vamos entender os padrões usados no nosso leitor.</p>

    <h4>4.1 Reset e base</h4>
    <pre>* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Verdana', sans-serif; background: #f5f7f6; ... }</pre>
    <ul>
      <li><code>*</code> → seletor universal (todos os elementos).</li>
      <li><code>box-sizing: border-box</code> → padding e borda não estouram a largura.</li>
      <li><code>body</code> → estilo global da página.</li>
    </ul>

    <pre>body { display: flex; align-items: center; justify-content: center; }

    <ul>
      <li><code>display: flex</code> → organiza filhos em linha ou coluna.</li>
      <li><code>align-items</code> → alinhamento vertical.</li>
      <li><code>justify-content</code> → alinhamento horizontal.</li>
      <li><code>gap</code> → espaçamento entre itens.</li>
      <li><code>flex-wrap: wrap</code> → quebra linha se faltar espaço.</li>
    </ul>

      <li><code>line-height</code> → espaço entre linhas (1.8 facilita leitura).</li>
      <li><code>text-align: justify</code> → texto alinhado às duas margens.</li>
    </ul>

    <pre>.progress-bar-bg { background: #dee6e1; height: 6px; border-radius: 20px; }

    <h3>5. O Bloco &lt;script&gt;: JavaScript e a Lógica</h3>
    <p>O JavaScript é o cérebro da aplicação. Vamos ver a organização geral do script.</p>

  // todo o código aqui dentro

    <ul>

      <li>Executa imediatamente e cria um escopo privado.</li>
      <li>Evita poluir o escopo global.</li>
      <li>Boa prática em scripts embutidos.</li>
    </ul>

    <h4>5.2 Array de páginas</h4>
    <pre>const pageContents = [

  // Tenta várias estratégias: nomes conhecidos em pt-BR, depois qualquer
  // voz em pt-BR, depois qualquer voz disponível.
  // =========================================================================
  const NOMES_FEMININOS = [
    'maria', 'francisca', 'luciana', 'helena', 'fernanda', 'camila',
    'female', 'mulher', 'feminina', 'woman', 'google português do brasil',
    'google portugues do brasil', 'microsoft maria', 'microsoft francisca',
    'microsoft helena', 'microsoft fernanda', 'microsoft camila',
    'ana', 'beatriz', 'carla', 'daniela', 'eduarda'
  ];

  function ehVozFeminina(v) {
    const nome = (v.name || '').toLowerCase();
    for (let i = 0; i < NOMES_FEMININOS.length; i++) {
      if (nome.indexOf(NOMES_FEMININOS[i]) !== -1) return true;
    }
    return false;
  }

  function getFemaleVoice() {
    if (!synth) return null;
    const voices = synth.getVoices();
    if (!voices || voices.length === 0) return null;

    const ptBR = voices.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
    const pt = voices.filter(v => (v.lang || '').toLowerCase().indexOf('pt') === 0);

    // 1ª tentativa: voz feminina pt-BR
    for (const v of ptBR) {
      if (ehVozFeminina(v)) return v;
    }
    // 2ª tentativa: voz feminina pt (qualquer região)
    for (const v of pt) {
      if (ehVozFeminina(v)) return v;
    }
    // 3ª tentativa: primeira voz pt-BR
    if (ptBR.length > 0) return ptBR[0];
    // 4ª tentativa: primeira voz pt
    if (pt.length > 0) return pt[0];

  function tokenizeTextNodes(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = [];
    while (walker.nextNode()) {
      textNodes.push(walker.currentNode);
    }
    textNodes.forEach(node => {
      const text = node.textContent;
      if (!text.trim()) return;
      if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;

      const fragment = document.createDocumentFragment();
      const parts = text.split(/(\s+)/);
      parts.forEach(part => {
        if (part.trim()) {
          const span = document.createElement('span');
          span.className = 'speech-word';
          span.textContent = part;
          fragment.appendChild(span);
        } else {
          fragment.appendChild(document.createTextNode(part));
        }
      });
      node.parentNode.replaceChild(fragment, node);
    });

      if (idx < spans.length - 1) map.push(idx);
    });
    return map;

  function startReading() {
    if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }

    wordSpans = Array.from(pageContent.querySelectorAll('.speech-word'));
    if (wordSpans.length === 0) return;
    charIndexToSpanMap = buildCharMapForSpans(wordSpans);

    }

    const token = Date.now();
    speechToken = token;
    currentCharIndex = 0;

    currentUtterance.onboundary = function(event) {
      if (speechToken !== token) return;
      if (event.name === 'word') {
        currentCharIndex = event.charIndex;
        syncHighlightFromCharIndex();
      }

      isPaused = false;
      showPlayingUI();

      resetSpeechState();

      if (speechToken !== token) return;

  }
  function resetSpeechState() {
    if (synth && synth.speaking) synth.cancel();
    if (currentUtterance) {
      currentUtterance.onboundary = null;
      currentUtterance.onstart = null;
      currentUtterance.onend = null;
      currentUtterance.onerror = null;
      currentUtterance = null;
    }
    isSpeaking = false;
    isPaused = false;
    speechToken = null;
    currentCharIndex = 0;
    clearAllWordHighlights();
    showStoppedUI();
  }

  // =========================================================================
  // LEITURA DE SELEÇÃO
  // =========================================================================
  document.addEventListener('selectionchange', function() {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      if (!range.collapsed && range.toString().trim() &&
          pageContent.contains(range.commonAncestorContainer)) {
        lastSelectionRange = range.cloneRange();
        lastSelectionText = sel.toString().trim();
      }
    }
  });

  function getActiveSelectionRange() {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      if (!range.collapsed && range.toString().trim() &&
          pageContent.contains(range.commonAncestorContainer)) {
        return range.cloneRange();
      }
    }
    if (lastSelectionRange && lastSelectionText) return lastSelectionRange;
    return null;
  }

  function setSelectionBtnState(state) {
    lerSelecaoBtn.classList.remove('reading', 'paused');
    if (state === 'reading') {
      lerSelecaoBtn.textContent = '⏸️ Pausar';
      lerSelecaoBtn.title = 'Pausar leitura da seleção';
      lerSelecaoBtn.classList.add('reading');
    } else if (state === 'paused') {
      lerSelecaoBtn.textContent = '▶️ Retomar';
      lerSelecaoBtn.title = 'Retomar leitura da seleção';
      lerSelecaoBtn.classList.add('paused');
    } else {
      lerSelecaoBtn.textContent = '📖 Ler Seleção';
      lerSelecaoBtn.title = 'Ler somente o trecho selecionado';
    }
  }

  function clearSelectionHighlights() {
    selectionWordSpans.forEach(s => {
      s.classList.remove('active');
      s.classList.remove('upcoming');
    });
    selectionPrevSpan = null;
  }

  function highlightSelectionWord(spanIdx) {
    if (selectionPrevSpan !== null && selectionWordSpans[selectionPrevSpan]) {
      selectionWordSpans[selectionPrevSpan].classList.remove('active');
      selectionWordSpans[selectionPrevSpan].classList.remove('upcoming');
    }
    if (spanIdx >= 0 && spanIdx < selectionWordSpans.length) {
      const s = selectionWordSpans[spanIdx];
      s.classList.add('active');
      s.classList.remove('upcoming');
      selectionPrevSpan = spanIdx;
      if (s.scrollIntoView) s.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    selectionWordSpans.forEach((s, i) => {
      if (i !== spanIdx) s.classList.remove('upcoming');
    });
    for (let i = 1; i <= 3; i++) {
      const next = selectionWordSpans[spanIdx + i];
      if (next) next.classList.add('upcoming');
    }
  }

  function startSelectionReading() {
    if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }
    if (isSpeaking || isPaused) stopReading();

    const range = getActiveSelectionRange();
    if (!range) {
      alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
      return;
    }

    if (pageContent.querySelectorAll('.speech-word').length === 0) {
      tokenizeTextNodes(pageContent);
    }

    const spans = [];
    pageContent.querySelectorAll('.speech-word').forEach(span => {
      try {
        if (range.intersectsNode(span)) spans.push(span);
      } catch (e) {}
    });

    if (spans.length === 0) {
      alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
      return;
    }

    selectionWordSpans = spans;
    selectionCharMap = buildCharMapForSpans(selectionWordSpans);
    clearSelectionHighlights();

    const text = spans.map(s => s.textContent).join(' ');
    selectionUtterance = new SpeechSynthesisUtterance(text);
    const voice = getFemaleVoice();
    if (voice) {
      selectionUtterance.voice = voice;
      selectionUtterance.lang = voice.lang;
    } else {
      selectionUtterance.lang = 'pt-BR';
    }
    selectionUtterance.rate = parseFloat(rateSelect.value);

    const token = Date.now();
    selectionToken = token;

    selectionUtterance.onboundary = function(event) {
      if (selectionToken !== token) return;
      if (event.name === 'word') {
        const charIdx = event.charIndex;
        if (charIdx < selectionCharMap.length) {
          const spanIdx = selectionCharMap[charIdx];
          if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
        }
      }
    };
    selectionUtterance.onstart = function() {
      if (selectionToken !== token) return;
      isReadingSelection = true;
      isSelectionPaused = false;
      setSelectionBtnState('reading');
      stopBtn.classList.remove('hidden');
    };
    selectionUtterance.onend = function() {
      if (selectionToken !== token) return;
      resetSelectionState();
    };
    selectionUtterance.onerror = function(e) {
      if (selectionToken !== token) return;
      resetSelectionState();
    };

    synth.speak(selectionUtterance);
  }

  function toggleSelectionReading() {
    if (isReadingSelection) {
      synth.pause();
      isReadingSelection = false;
      isSelectionPaused = true;
      setSelectionBtnState('paused');
    } else if (isSelectionPaused) {
      synth.resume();
      isReadingSelection = true;
      isSelectionPaused = false;
      setSelectionBtnState('reading');
    } else {
      startSelectionReading();
    }
  }

  function stopSelectionReading() {
    if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
    resetSelectionState();
  }

  function resetSelectionState() {
    if (selectionUtterance) {
      selectionUtterance.onboundary = null;
      selectionUtterance.onstart = null;
      selectionUtterance.onend = null;
      selectionUtterance.onerror = null;
      selectionUtterance = null;
    }
    isReadingSelection = false;
    isSelectionPaused = false;
    selectionToken = null;
    clearSelectionHighlights();
    setSelectionBtnState('idle');
    stopBtn.classList.add('hidden');
  }

  // =========================================================================
  // RENDER E NAVEGAÇÃO
  // =========================================================================
  function updateUI() {
    resetSpeechState();
    resetSelectionState();

    pageContent.innerHTML = paginas[currentPage];
    tokenizeTextNodes(pageContent);
    lastSelectionRange = null;
    lastSelectionText = '';

    const num = currentPage + 1;
    pageXofY.textContent = `Página ${num} de ${totalPages}`;
    const pct = (num / totalPages) * 100;
    progressFill.style.width = pct + '%';
    progressPercent.textContent = Math.round(pct) + '%';

    prevBtn.disabled = (currentPage === 0);
    nextBtn.disabled = (currentPage === totalPages - 1);

    if (currentPage === totalPages - 1) {
      encerrarBtn.classList.remove('hidden');
    } else {
      encerrarBtn.classList.add('hidden');
    }

    if (pageContent.scrollTop) pageContent.scrollTop = 0;
  }

  function changePage(delta) {
    const newPage = currentPage + delta;
    if (newPage >= 0 && newPage < totalPages) {
      currentPage = newPage;
      updateUI();
    }
  }

  function applyFontSize() {
    pageContent.style.fontSize = fontSizes[fontSizeIndex] + 'px';
    fontMinusBtn.disabled = (fontSizeIndex === 0);
    fontPlusBtn.disabled = (fontSizeIndex === fontSizes.length - 1);
  }

  // =========================================================================
  // EVENTOS
  // =========================================================================
  fontMinusBtn.addEventListener('click', () => {
    if (fontSizeIndex > 0) fontSizeIndex--;
    applyFontSize();
  });
  fontPlusBtn.addEventListener('click', () => {
    if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
    applyFontSize();
  });
  fullscreenBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  prevBtn.addEventListener('click', () => changePage(-1));
  nextBtn.addEventListener('click', () => changePage(1));

  speakBtn.addEventListener('click', startReading);
  pauseBtn.addEventListener('click', pauseReading);
  resumeBtn.addEventListener('click', resumeReading);
  stopBtn.addEventListener('click', () => {
    if (isReadingSelection || isSelectionPaused) stopSelectionReading();
    if (isSpeaking || isPaused) stopReading();
  });
  lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

  rateSelect.addEventListener('change', () => {
    const rate = parseFloat(rateSelect.value);
    if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
    if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
  });

  encerrarBtn.addEventListener('click', () => {
    if (synth) synth.cancel();
    window.open('about:blank', '_blank');
  });

  // =========================================================================
  // INICIALIZAÇÃO
  // =========================================================================
  applyFontSize();
  updateUI();
  if (synth) synth.getVoices();
  if (synth && typeof synth.onvoiceschanged !== 'undefined') {
    synth.onvoiceschanged = function() { /* vozes carregadas */ };
  }

})();
</script>
</body>
</html>
