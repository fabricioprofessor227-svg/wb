    // ============================================================
    // LÓGICA DO QUIZ
    // ============================================================
    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let userJustification = new Array(total).fill(null);

    const mainWrapper = document.getElementById('mainWrapper');
    const capaScreen = document.getElementById('capaScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const blankScreen = document.getElementById('blankScreen');
    const questionText = document.getElementById('questionText');
    const optionsArea = document.getElementById('optionsArea');
    const feedbackArea = document.getElementById('feedbackArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const returnPresentationBtn = document.getElementById('returnPresentationBtn');
    const resultContent = document.getElementById('resultContent');
    const fontMinus = document.getElementById('fontMinus');
    const fontPlus = document.getElementById('fontPlus');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let currentFontSize = 16;

    function setFontSize(size) {
        mainWrapper.style.fontSize = size + 'px';
        const els = document.querySelectorAll('.question-text, .feedback, .opt-btn, .tool-btn, .action-btn, .start-btn');
        els.forEach(el => el.style.fontSize = size + 'px');
        currentFontSize = size;
    }

    fontMinus.addEventListener('click', () => setFontSize(Math.max(12, currentFontSize - 2)));
    fontPlus.addEventListener('click', () => setFontSize(Math.min(36, currentFontSize + 2)));
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    function renderOptions(q) {
        optionsArea.innerHTML = '';
        if (q.type === 'truefalse') {
            const btnTrue = document.createElement('button');
            btnTrue.className = 'opt-btn';
            btnTrue.setAttribute('data-value', 'true');
            btnTrue.textContent = '✅ Verdadeiro';
            const btnFalse = document.createElement('button');
            btnFalse.className = 'opt-btn';
            btnFalse.setAttribute('data-value', 'false');
            btnFalse.textContent = '❌ Falso';
            optionsArea.appendChild(btnTrue);
            optionsArea.appendChild(btnFalse);
        } else if (q.type === 'multiple') {
            const letters = ['A', 'B', 'C'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.setAttribute('data-value', idx);
                btn.textContent = `${letters[idx]}) ${opt}`;
                btn.style.flex = '1 1 100%';
                btn.style.textAlign = 'left';
                btn.style.padding = '12px 18px';
                optionsArea.appendChild(btn);
            });
        }
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerHTML = `<strong>Questão ${currentIndex + 1}:</strong> ${q.text}`;
        feedbackArea.style.display = 'none';
        feedbackArea.className = 'feedback';
        renderOptions(q);

        const selected = userAnswers[currentIndex];
        if (selected !== null) {
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(btn => {
                const val = btn.getAttribute('data-value');
                if (q.type === 'truefalse') {
                    if ((val === 'true' && selected === true) || (val === 'false' && selected === false)) {
                        btn.classList.add('selected');
                    }
                } else if (q.type === 'multiple') {
                    if (parseInt(val) === selected) btn.classList.add('selected');
                }
            });
            if (userJustification[currentIndex]) {
                const isCorrect = (selected === q.correct);
                feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
                feedbackArea.style.display = 'block';
                feedbackArea.innerHTML = userJustification[currentIndex];
            }
        }
        progressText.innerText = `Questão ${currentIndex + 1} de ${total}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
    }

    function selectAnswer(value, q) {
        let answer;
        if (q.type === 'truefalse') {
            answer = (value === 'true');
        } else {
            answer = parseInt(value);
        }
        userAnswers[currentIndex] = answer;
        const isCorrect = (answer === q.correct);

        let correctText;
        if (q.type === 'truefalse') {
            correctText = q.correct ? 'Verdadeiro' : 'Falso';
        } else {
            const letters = ['A', 'B', 'C'];
            correctText = `${letters[q.correct]}) ${q.options[q.correct]}`;
        }

        const explanation =
            `<strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br><strong>Gabarito:</strong> ${correctText}<br><strong>Justificativa:</strong> ${q.justification}`;

        userJustification[currentIndex] = explanation;
        feedbackArea.classList.remove('correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.style.display = 'block';
        feedbackArea.innerHTML = explanation;

        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(btn => btn.classList.remove('selected'));
        if (q.type === 'truefalse') {
            const selectedBtn = Array.from(btns).find(btn => btn.getAttribute('data-value') === value);
            if (selectedBtn) selectedBtn.classList.add('selected');
        } else {
            const selectedBtn = Array.from(btns).find(btn => parseInt(btn.getAttribute('data-value')) === answer);
            if (selectedBtn) selectedBtn.classList.add('selected');
        }
    }

    optionsArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (!btn) return;
        const q = questions[currentIndex];
        selectAnswer(btn.getAttribute('data-value'), q);
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            mostrarResultado();
        }
    });

    function mostrarResultado() {
        let acertos = 0;
        let erros = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].correct) acertos++;
            else if (userAnswers[i] !== null) erros++;
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let mensagem = "";
        if (percentual >= 85) mensagem = "⭐ Excelente! Você domina os conceitos de Velha e Nova Ordem Mundial, Guerra Fria, globalização, blocos econômicos e regionalizações. Parabéns!";
        else if (percentual >= 70) mensagem = "👍 Muito bom! Revise os pontos que errou e tente novamente.";
        else if (percentual >= 50) mensagem = "📘 Bom, mas dá para melhorar. Releia o material sobre Velha Ordem, Guerra Fria, Nova Ordem Mundial, unimultipolaridade, globalização, blocos econômicos, BRICS e regionalizações Norte/Sul.";
        else mensagem = "📚 Que tal revisar o conteúdo? Leia com calma o documento e depois refaça o quiz.";

        const resultadoHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${erros}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #e2e8f0;">
                <p>${mensagem}</p>
            </div>
        `;
        resultContent.innerHTML = resultadoHTML;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    function refazerQuiz() {
        userAnswers = new Array(total).fill(null);
        userJustification = new Array(total).fill(null);
        currentIndex = 0;
        mainWrapper.classList.remove('wrapper-blank');
        blankScreen.classList.remove('active');
        resultScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    }

    startQuizBtn.addEventListener('click', () => {
        capaScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    restartQuizBtn.addEventListener('click', refazerQuiz);
    returnPresentationBtn.addEventListener('click', () => {
        window.location.href = 'https://docs.google.com/presentation/d/1dBvhOn8Ua9HvljSyKug_-msWA10YMV0ODS0qU4lJtPI/edit?slide=id.h2613700f4cea9d9f_0_7#slide=id.h2613700f4cea9d9f_0_7';
    });

    setFontSize(16);
</script>
